name: Calendar sync

# GitHub Actions cron is UTC only. Rather than depend on a per-schedule
# timezone field, the job runs every hour and works out the local hour for
# itself. That is the behaviour the reminder ladder needs anyway, and it keeps
# working if the workflow syntax ever changes underneath us.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      # Both boxes default to unticked and mean "do more than usual" when
      # ticked. The previous wording, "log reminders instead of sending them",
      # defaulted to ticked and read like the helpful option, so ticking it was
      # the natural thing to do and it silently prevented every send.
      really_send:
        description: 'SEND reminders to GroupMe for real (unticked = only write them to the log)'
        type: boolean
        default: false
      send_now:
        description: 'Ignore the 9am send hour, so a reminder can be tested right now'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

# Never let two runs overlap. They would race on the reminder dedupe state and
# could send the same reminder twice.
concurrency:
  group: calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: job/package-lock.json

      - name: Install
        working-directory: job
        run: npm ci

      # A broken classifier would quietly publish wrong data to the website and
      # wrong dates to parents. Cheap enough to run every hour.
      - name: Check
        working-directory: job
        run: npm run check

      - name: Sync calendars
        working-directory: job
        env:
          # Calendar ids are not secrets and live in config/ministries.json.
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GROUPME_BOT_YOUTH_PARENTS: ${{ secrets.GROUPME_BOT_YOUTH_PARENTS }}
          # Reminders stay a dry run until this repository variable is set to
          # "true". Having a bot configured is setup, not consent to start
          # messaging parents.
          REMINDERS_LIVE: ${{ vars.REMINDERS_LIVE }}
          # A manual run is a dry run unless "really_send" was ticked. A
          # scheduled run is not forced either way, so REMINDERS_LIVE decides.
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && !inputs.really_send) && 'true' || '' }}
          FORCE_SEND_HOUR: ${{ inputs.send_now && 'true' || '' }}
        run: npm start

      # Two things are true at once: scheduled workflows are disabled after 60
      # days without repo activity, and nobody wants 24 commits a day that only
      # move a timestamp. So commit when the data really changed, and otherwise
      # force a keepalive commit well inside the 60 day window. The site still
      # updates hourly, because the deploy below does not depend on a commit.
      - name: Commit changed data
        id: commit
        run: |
          git config user.name 'glbc-calendar-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # job/state carries a .gitkeep so this path always exists; git add
          # fails outright on a pathspec that matches nothing.
          git add public job/state

          if git diff --cached --quiet; then
            echo 'No output changes at all.'
            exit 0
          fi

          REAL=$(git diff --cached -U0 \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -v '"generated"' \
            | head -1 || true)

          LAST=$(git log -1 --format=%ct)
          AGE_DAYS=$(( ( $(date +%s) - LAST ) / 86400 ))

          if [ -n "$REAL" ]; then
            git commit -m "Calendar data changed $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          elif [ "$AGE_DAYS" -ge 20 ]; then
            git commit -m "Keepalive: scheduled workflows are disabled after 60 idle days"
            git push
          else
            echo "Only the generated timestamp moved, and the last commit was ${AGE_DAYS}d ago. Skipping."
            git reset
          fi

      # Off-Google, off-this-repo copy of every calendar, private ones
      # included, which is why it goes to a separate private repository and
      # never into public/. Skipped with a notice until it is configured, so
      # it can be switched on without touching this file.
      - name: Back up calendars
        if: ${{ vars.BACKUP_REPO != '' }}
        env:
          BACKUP_REPO: ${{ vars.BACKUP_REPO }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          if [ -z "$BACKUP_TOKEN" ]; then
            echo "::error::BACKUP_REPO is set but BACKUP_TOKEN is missing. Calendars are NOT being backed up."
            exit 1
          fi
          if [ ! -f backup/manifest.json ]; then
            echo "::error::The job produced no backup snapshot."
            exit 1
          fi

          git clone --depth 1 \
            "https://x-access-token:$BACKUP_TOKEN@github.com/$BACKUP_REPO.git" /tmp/backup-repo

          rm -rf /tmp/backup-repo/backup
          cp -r backup /tmp/backup-repo/backup

          cd /tmp/backup-repo
          git config user.name 'glbc-calendar-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Calendars unchanged since the last snapshot.'
          else
            git commit -m "Snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo 'Snapshot pushed.'
          fi

      - name: Warn when backups are off
        if: ${{ vars.BACKUP_REPO == '' }}
        run: |
          echo "::warning::No BACKUP_REPO variable set, so calendars are not being backed up. See docs/BACKUP.md."

      # Assemble exactly what scripts/serve.mjs serves locally: the pages in
      # site/ over the job output in public/.
      - name: Assemble site
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          mkdir -p _site
          cp -r public/. _site/
          cp -r site/. _site/

          # Without this, Pages runs the output through Jekyll, which is how a
          # repo README ends up served instead of the calendar.
          touch _site/.nojekyll

          # Pages does not strip .html, so /signup would 404. These printed and
          # QR-coded addresses want to read as /signup, not /signup.html, and
          # both keep working.
          for page in signup prefs tv admin; do
            if [ -f "_site/$page.html" ]; then
              mkdir -p "_site/$page"
              cp "_site/$page.html" "_site/$page/index.html"
            fi
          done

          # The CNAME file appears only once a custom domain actually resolves.
          # Shipping it earlier makes Pages redirect to a hostname that does not
          # exist yet, so the site cannot be tested at all before DNS is done.
          # Set the SITE_DOMAIN repository variable when the record goes live.
          if [ -n "$SITE_DOMAIN" ]; then
            echo "$SITE_DOMAIN" > _site/CNAME
            echo "Custom domain: $SITE_DOMAIN"
          else
            echo 'No SITE_DOMAIN variable set. Serving on the default github.io URL.'
          fi

          ls _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Silent failure is the real operational risk: feeds go stale and
          # nobody notices. An issue emails whoever watches the repo.
          EXISTING=$(gh issue list --label sync-failure --state open \
            --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Sync failed again: $RUN_URL"
          else
            gh label create sync-failure --color B60205 --force >/dev/null 2>&1 || true
            cat > /tmp/body.md <<BODY
          The hourly calendar sync failed. Feeds and the website will go stale
          until this is fixed.

          Run: $RUN_URL

          Close this issue once the sync is green again.
          BODY
            sed -i 's/^          //' /tmp/body.md
            gh issue create --label sync-failure \
              --title 'Calendar sync is failing' \
              --body-file /tmp/body.md
          fi

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
