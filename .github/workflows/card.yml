name: Make the calendar card

# Manual on purpose. A card goes to a printer on the church's schedule, not the
# calendar's — somebody may add an event on the 16th, right before sending it.
# An automatic monthly build would also quietly replace a file after it had
# already gone to the printer, so the copy on the site would stop matching what
# was actually printed.
on:
  workflow_dispatch:
    inputs:
      month:
        description: 'First month, as YYYY-MM. Leave blank for the two months ahead.'
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: calendar-card
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: job/package-lock.json

      - name: Install
        working-directory: job
        run: npm ci

      - name: Build the card
        working-directory: job
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CARD_MONTH: ${{ inputs.month }}
          # Lets the run hand the finished card to the Apps Script endpoint to
          # email. Without it the card is still built and published; only the
          # email is skipped, and the log says so.
          ADMIN_PASSCODE: ${{ secrets.ADMIN_PASSCODE }}
        run: npm run card

      - name: Publish it
        run: |
          git config user.name 'glbc-calendar-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/card
          if git diff --cached --quiet; then
            echo 'The card is identical to the one already published.'
            exit 0
          fi
          git commit -m "Calendar card $(date -u +'%Y-%m-%d')"

          # The hourly sync commits to this repo too, and a build takes long
          # enough to be overtaken by one. Without this, a card that built
          # perfectly well would report failure for a reason that has nothing
          # to do with the card.
          for attempt in 1 2 3; do
            if git push; then
              echo 'Pushed. The site redeploys within a couple of minutes.'
              exit 0
            fi
            echo "Push $attempt was beaten to it; rebasing and trying again."
            git pull --rebase
          done
          echo '::error::Could not push the card after three attempts.'
          exit 1
